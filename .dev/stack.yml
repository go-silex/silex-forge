# .dev/stack.yml — repo contract read by the dev-core skills. COMMITTED, no secrets.
#
# Hand-written, NOT copied from stack.yml.example: that template assumes
# bun + nestjs + tanstack-start + turbo + biome + vercel. None of it applies here.
#
# This repo is a publishing engine: bash (scripts) + Python 3.9 stdlib (lib/ + unittest)
# + a tiny TS surface (functions/ Cloudflare Pages, vitest).
#
# Deliberately absent:
#   hooks.tool: none    → validation lives in CI (5 jobs), not in a pre-commit hook
#   quality_gates       → QG_FILE_ROOT is hardcoded on src/; no src/ here ⇒ dead gate
#   build.formatter     → no formatter in this repo; keeps the format.cjs hook inert
#   deploy.platform     → deploys go through publish.sh → wrangler pages deploy, never CI

schema_version: "1.0"

runtime: node
package_manager: npm

backend:
  framework: none
  # Pages Functions are the server surface (Access middleware, /api/*, /s/*):
  # R-backend-dev is the right reviewer for them, not R-frontend-dev.
  path: functions

frontend:
  framework: none
  path: ""

build:
  orchestrator: none
  formatter: none
  formatter_fix_cmd: ""

testing:
  unit: vitest
  e2e: none

hooks:
  tool: none

lsp:
  enabled: true

deploy:
  platform: none
  secrets_cmd: ""

# Real model: tag on merge to main via scripts/release-plugin.sh
# (Convention A, <component>/vX.Y.Z). Versions are stamped by
# scripts/check_plugin_versions.py across 9 manifests + CHANGELOG, so
# version_files stays empty — dev-core must not rewrite any of them.
release:
  model: trunk
  class: NONE
  component: silex-forge
  version_files: []

docs:
  framework: none
  path: docs
  format: md

# The real validation command: the three suites CI runs.
# run-os-script-tests.sh already contains `python3 -m unittest discover -s tests/python`.
commands:
  test: "npm test && bash tests/shell/run-os-script-tests.sh && bash tests/shell/test_release_plugin.sh"
  typecheck: npm run typecheck
  install: npm ci
  # No `lint` key: there is no linter in this repo (ShellCheck runs in CI), so the
  # skills that probe for the key pass --lint false instead of inventing a command.

review:
  roster:
    max_agents: 4
    verify_below_confidence: 90
    recall_min_delta: 50
    agents:
      R-adversarial: default
      R-security-auditor: default
      R-tester: default
      # No frontend app: zero .tsx/.jsx/.vue/.svelte/.css/.scss files here, so
      # FE_EXT_RE (roster.ts:113) matches nothing today — `.ts` is not in it.
      # `never` locks the future case: an empty frontend.path makes feHit fall
      # back to that extension match, so one .css added under site/ would
      # convoke a frontend agent on a repo that has no frontend.
      R-frontend-dev: never
      R-backend-dev: default
      R-devops: default
      R-architect: default
      # Structural gate AXIAL_RE = ^(infrastructure|adapters|domains|stages)/ —
      # none of those directories exist here, so this agent stays no-path-hit
      # whatever the value. ADR 0001 is enforced by review, not by this gate.
      R-axial-adr-review: default

artifacts:
  brainstorms: artifacts/brainstorms
  analyses: artifacts/analyses
  specs: artifacts/specs
  frames: artifacts/frames
  plans: artifacts/plans

# No docs/standards/ here: the hard conventions live in AGENTS.md
# (§ Agent rules, § Hub drift guard) and the architecture docs in docs/.
standards:
  architecture: docs/
  code_review: AGENTS.md
  testing: AGENTS.md
  contributing: CONTRIBUTING.md
