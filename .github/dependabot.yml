# Dependency updates. Two ecosystems only: the JS test toolchain (vitest,
# typescript, @cloudflare/workers-types) and the actions pinned in ci.yml.
# The Python side is stdlib-only (3.9 floor asserted in CI) — nothing to track.
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # One PR for the whole minor/patch wave: the suite is fast (16 s) and
      # every dep here is dev-only, so per-package PRs are pure noise.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns:
          - "*"
