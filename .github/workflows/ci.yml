name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  # Processed PR merge → skip suite. Naked push → run suite.
  # ~/projects/ssot/conventions.ssot.md § CI landing
  classify:
    name: Classify push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      path: ${{ steps.out.outputs.path }}
    steps:
      - id: out
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          path=naked
          n=0
          prs="[]"
          for i in 1 2 3 4 5; do
            prs="$(gh api "repos/${REPO}/commits/${SHA}/pulls")"
            n="$(printf '%s' "$prs" | jq --arg sha "$SHA" '[.[] | select(.merged == true and .merge_commit_sha == $sha)] | length')"
            if [ "$n" -gt 0 ]; then
              break
            fi
            if [ "$i" -lt 5 ]; then
              sleep 4
            fi
          done
          if [ "$n" -gt 0 ]; then
            head="$(printf '%s' "$prs" | jq -r --arg sha "$SHA" '[.[] | select(.merged == true and .merge_commit_sha == $sha)][0].head.sha')"
            conc="$(gh api --paginate "repos/${REPO}/commits/${head}/check-runs" --jq '[.check_runs[] | select((.name | ascii_downcase) == "check") | .conclusion] | map(select(. == "success")) | if length > 0 then "success" else "missing" end')"
            if [ "$conc" = "success" ]; then
              path=pr-merge
            fi
          fi
          echo "path=${path}" >> "$GITHUB_OUTPUT"
          echo "landing path: ${path}"

  check:
    needs: [classify]
    if: always() && !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'push' || needs.classify.outputs.path == 'naked')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Shell syntax (publish.sh)
        run: |
          bash -n plugins/silex-forge/scripts/publish.sh
          bash -n scripts/release-plugin.sh

      - name: ShellCheck (publish.sh, forge-doctor)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -e SC1091,SC2086 plugins/silex-forge/scripts/publish.sh
          shellcheck plugins/silex-forge/scripts/forge-doctor.sh
          shellcheck scripts/release-plugin.sh

      - name: Python compile
        run: |
          python3 -m py_compile plugins/silex-forge/scripts/lib/load_config.py
          python3 -m py_compile plugins/silex-forge/scripts/lib/patch_wrangler.py
          python3 -m py_compile scripts/check_plugin_versions.py

      - name: Shell syntax (test_release_plugin.sh)
        run: bash -n tests/shell/test_release_plugin.sh

      - name: ShellCheck (test_release_plugin.sh)
        run: shellcheck tests/shell/test_release_plugin.sh

      - name: Plugin versions consistent (Claude/Grok/OMP/Codex + CHANGELOG)
        run: python3 scripts/check_plugin_versions.py

      - name: patch_wrangler smoke (TOML escaping)
        run: |
          cp wrangler.toml /tmp/wrangler-ci.toml
          python3 plugins/silex-forge/scripts/lib/patch_wrangler.py \
            /tmp/wrangler-ci.toml \
            "test-kv-id" \
            'team.example.com' \
            "aud-one,aud-two" \
            "forge.example.com" \
            "https://s.example.com/rest/v3/short-urls"
          grep -q 'CF_ACCESS_TEAM_DOMAIN' /tmp/wrangler-ci.toml
          grep -q 'PUBLIC_HOST' /tmp/wrangler-ci.toml
          grep -q 'SHLINK_API_URL' /tmp/wrangler-ci.toml

      - name: Example config loads
        run: |
          PYTHONPATH=plugins/silex-forge/scripts/lib \
            python3 -c "from load_config import load_config; c=load_config(); assert c.get('version')"

      - name: No committed artifact HTML
        run: |
          if [ -d site/a ]; then
            extras=$(find site/a -type f ! -name '.gitkeep' | wc -l)
            [ "$extras" -eq 0 ] || (echo "site/a must not contain artifact HTML" && find site/a -type f ! -name '.gitkeep' && exit 1)
          fi
          test ! -f site/index.html || (echo "site/index.html must not be in git" && exit 1)
          test ! -f site/manifest.json || (echo "site/manifest.json must not be in git" && exit 1)
          if [ -d registry ]; then
            extras=$(find registry -type f 2>/dev/null | wc -l)
            [ "$extras" -eq 0 ] || (echo "registry must not contain JSON payloads" && exit 1)
          fi

      # Secret / infra scan — exclusions documented to avoid false positives:
      #   :!*.md          prose may mention token shapes
      #   :!tests/**      fake tokens / contract fixtures
      #   :!.env.example placeholder names only
      #   :!CHANGELOG.md  release notes
      - name: Secret / infra ID scan
        run: |
          set -e
          scan() {
            git grep -E "$1" -- . \
              ':!*.md' \
              ':!tests/**' \
              ':!.env.example' \
              ':!CHANGELOG.md' \
              ':!package-lock.json'
          }
          if scan 'CLOUDFLARE_ACCOUNT_ID=[0-9a-f]{32}'; then
            echo "found hardcoded CF account id"; exit 1
          fi
          if scan 'FORGE_SHARES_KV_ID=[0-9a-f]{32}'; then
            echo "found hardcoded KV namespace id"; exit 1
          fi
          if git grep -E 'id = "[0-9a-f]{32}"' wrangler.toml 2>/dev/null; then
            echo "found KV id in wrangler.toml"; exit 1
          fi
          token_prefix='cf''ut_'
          key_prefix='cf''k_'
          token_assignment='CLOUDFLARE_API_''TOKEN='
          if scan "${token_prefix}[A-Za-z0-9_-]{20,}|${key_prefix}[A-Za-z0-9_-]{20,}|${token_assignment}[^[:space:]]{16,}"; then
            echo "possible committed Cloudflare credential pattern"; exit 1
          fi

  test:
    needs: [classify, check]
    if: always() && !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'push' || needs.classify.outputs.path == 'naked') && (needs.check.result == 'success' || needs.check.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JS test deps
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Vitest (Functions hardening spec)
        run: npm test

      - name: Python unit tests
        run: python3 -m unittest discover -s tests/python -p 'test_*.py' -v

      - name: Shell contract tests
        run: |
          bash tests/shell/test_publish_contracts.sh
          bash tests/shell/test_forge_doctor.sh

      - name: Release plugin tests
        run: bash tests/shell/test_release_plugin.sh

  # On a processed PR merge, check/test are skipped (see classify and
  # ~/projects/ssot/conventions.ssot.md § CI landing → "do not retest — effects only").
  # A bare `needs:` would skip release: the tag would NEVER be cut on the
  # normal landing path.
  # Fail-closed: classify must have succeeded. If it fails, check/test are
  # skipped without the suite having run — do not cut a tag in that case.
  release:
    needs: [classify, check, test]
    if: always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.classify.result == 'success' && (needs.check.result == 'success' || needs.check.result == 'skipped') && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag vX.Y.Z and GitHub Release when plugin version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-plugin.sh
