# Deploy site/ + functions/ → Cloudflare Pages (silex-forge)
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "functions/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # functions/ + wrangler.toml bindings picked from repo root (cwd)
          command: pages deploy site --project-name=silex-forge --branch=main --commit-dirty=true
