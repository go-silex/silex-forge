name: Secret scan

# Same entrypoint as the pre-push hook: `bash scripts/secret-scan.sh`. Not the
# trufflesecurity/trufflehog action — the action defaults to `version: latest`
# and runs `docker run "${IMAGE}:${VERSION}"`, so pinning its commit SHA would
# not pin the scanner, and it appends `--fail` itself (which forbids passing the
# flag we need on the custom-detector pass). The script owns the pin
# (config/trufflehog.version, sha256-verified) and both passes' flags.
#
# Consequence, accepted: no `uses:` here means Dependabot's github-actions
# ecosystem has nothing to track, so scanner bumps are manual. See the header of
# config/trufflehog.version.
#
# Scope: the whole checked-out tree on every run, not a diff. `schedule` keeps a
# weekly run on main so a scanner update surfaces findings in code that has not
# changed.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secret-scan:
    name: TruffleHog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan (pinned scanner, two passes)
        run: bash scripts/secret-scan.sh
