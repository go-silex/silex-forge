<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Introuvable — Silex Forge</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#031635">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* STRUCTUREL — sans 404.html Pages traite le site en SPA et renvoie / sur tout chemin. */
:root {
  --paper: #FEFEFE; --ink: #031635; --secondary: #2e5f9d; --outline: #6b7a90;
  --sky: #6B9FD4; --peach: #EB7457;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh; display: grid; place-items: center;
  font-family: Manrope, system-ui, sans-serif; color: var(--ink);
  background:
    radial-gradient(50% 50% at 70% 20%, rgba(107,159,212,.35), transparent 70%),
    var(--paper);
  -webkit-font-smoothing: antialiased;
}
main { max-width: 28rem; padding: 2rem 1.5rem; text-align: center; }
.kicker {
  font-family: "JetBrains Mono", monospace; font-size: .72rem;
  letter-spacing: .16em; text-transform: uppercase; color: var(--outline);
}
h1 {
  font-family: "Instrument Serif", Georgia, serif; font-weight: 400;
  font-size: clamp(1.8rem, 4vw, 2.4rem); margin: 1rem 0 .75rem; line-height: 1.15;
}
h1 em { font-style: italic; color: var(--secondary); }
p { color: var(--outline); line-height: 1.5; }
.btn {
  display: inline-flex; margin-top: 1.75rem; padding: .85rem 1.5rem;
  background: var(--ink); color: #fff; text-decoration: none; font-weight: 500;
}
.btn:hover { background: var(--secondary); }
</style>
</head>
<body>
<main>
  <div class="kicker">404 · forge.gosilex.com</div>
  <h1>Artefact <em>introuvable</em></h1>
  <p>Ce lien n’existe plus, ou le slug est incorrect.</p>
  <a class="btn" href="/">Retour au catalogue</a>
</main>
</body>
</html>
